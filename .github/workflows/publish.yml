name: Publish

# Release = push a tag vX.Y.Z whose version matches pyproject.toml and has a
# "## [X.Y.Z]" section in CHANGELOG.md. PyPI upload uses trusted publishing
# (OIDC): no API token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag with the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          package=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/dssketch/__init__.py)
          echo "tag=$tag pyproject=$pyproject __init__=$package"
          [ "$tag" = "$pyproject" ] && [ "$tag" = "$package" ] || {
            echo "::error::Tag v$tag does not match pyproject.toml ($pyproject) / __init__.py ($package)"
            exit 1
          }
      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || {
            echo "::error::CHANGELOG.md has no '## [$tag]' section"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Upload to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dssketch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
