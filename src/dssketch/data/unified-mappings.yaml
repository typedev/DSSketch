# Unified Font Attribute Mappings (Compact Schema v2.0)
# Maps style names to OS/2 table values and user space coordinates
# 
# COMPACT SCHEMA:
# - For weight: only user_space values (os2 = user_space for weight)
# - For width: both os2 (1-9 class) and user_space (% of normal per the OS/2 spec)
# - Aliases: entries with only 'alias_of' inherit all values from referenced entry
# - Fallback: if user_space missing, use os2; if os2 missing, use user_space

weight:
  # Basic weights - only user_space needed (os2 values are identical)
  Hairline:
    user_space: 50
    
  Thin:
    user_space: 100
    
  Extralight:
    user_space: 200
    
  ExtraLight:  # Common alias - inherits from Extralight
    alias_of: Extralight
    
  Light:
    user_space: 300
    
  Book:
    user_space: 350
    
  Regular:
    user_space: 400
    
  Medium:
    user_space: 500
    
  Semibold:
    user_space: 600
    
  SemiBold:  # Common alias - inherits from Semibold
    alias_of: Semibold
    
  Bold:
    user_space: 700
    
  Extrabold:
    user_space: 800
    
  ExtraBold:  # Common alias - inherits from Extrabold
    alias_of: Extrabold
    
  Heavy:
    user_space: 800
    
  Black:
    user_space: 900

  # Italic variants - only user_space needed
  "Hairline Italic":
    user_space: 50
    style: italic
    
  "Thin Italic":
    user_space: 100
    style: italic
    
  "Extralight Italic":
    user_space: 200
    style: italic
    
  "ExtraLight Italic":  # Alias - inherits from "Extralight Italic"
    alias_of: "Extralight Italic"
    
  "Light Italic":
    user_space: 300
    style: italic
    
  "Book Italic":
    user_space: 350
    style: italic
    
  Italic:
    user_space: 400
    style: italic
    
  "Medium Italic":
    user_space: 500
    style: italic
    
  "Semibold Italic":
    user_space: 600
    style: italic
    
  "SemiBold Italic":  # Alias - inherits from "Semibold Italic"
    alias_of: "Semibold Italic"
    
  "Bold Italic":
    user_space: 700
    style: italic
    
  "Extrabold Italic":
    user_space: 800
    style: italic
    
  "ExtraBold Italic":  # Alias - inherits from "Extrabold Italic"
    alias_of: "Extrabold Italic"
    
  "Heavy Italic":
    user_space: 800
    style: italic
    
  "Black Italic":
    user_space: 900
    style: italic

width:
  # OpenType OS/2 usWidthClass (1-9) and its "% of normal" column, which the
  # spec gives as the mapping to 'wdth' values. CSS font-width keywords use
  # the same percentages. Spec names are canonical; Compressed, Wide, Narrow
  # and the *Extended forms are common aliases.
  # https://learn.microsoft.com/en-us/typography/opentype/spec/os2#uswidthclass

  UltraCondensed:
    os2: 1
    user_space: 50

  Compressed:       # Common name for Ultra-condensed
    alias_of: UltraCondensed

  ExtraCondensed:
    os2: 2
    user_space: 62.5

  SemiCompressed:   # Common name for Extra-condensed
    alias_of: ExtraCondensed

  Condensed:
    os2: 3
    user_space: 75

  SemiCondensed:
    os2: 4
    user_space: 87.5

  Narrow:           # Common name for Semi-condensed
    alias_of: SemiCondensed

  Normal:
    os2: 5
    user_space: 100

  SemiExpanded:
    os2: 6
    user_space: 112.5

  SemiExtended:
    alias_of: SemiExpanded

  Wide:             # Common name for Semi-expanded
    alias_of: SemiExpanded

  Expanded:
    os2: 7
    user_space: 125

  Extended:
    alias_of: Expanded

  ExtraExpanded:
    os2: 8
    user_space: 150

  ExtraExtended:
    alias_of: ExtraExpanded

  UltraExpanded:
    os2: 9
    user_space: 200

  UltraExtended:
    alias_of: UltraExpanded

# Metadata about this mapping
metadata:
  version: "2.0"
  description: "Unified font attribute mappings between style names, OS/2 table values, and user space coordinates"
  
  # Compact schema description
  schema:
    compact: true
    fallback_logic: "If user_space is missing, use os2 value. If os2 is missing, use user_space value."
    weight_axis: "Uses user_space values (os2 values are the same for weight)"
    width_axis: "Uses both os2 (1-9 class) and user_space (the spec's % of normal)"
    aliases: "Entries with only 'alias_of' inherit all values from the referenced entry"
  
  sources:
    - "OpenType specification"
    - "CSS Fonts specification" 
    - "fontTools designspace format"
    - "Original Standards class"
    - "stylenames.json"
  
  # Default fallback values for unknown names
  defaults:
    weight:
      os2: 400
      user_space: 400.0
    width:
      os2: 5
      user_space: 100.0
  
  notes:
    - "COMPACT SCHEMA v2.0: Eliminates redundancy between os2 and user_space"
    - "For weight: Only user_space values stored (os2 = user_space for weight axis)"
    - "For width: Both values stored (OS/2 1-9 class, user_space = the spec's % of normal)"
    - "Aliases inherit all properties from referenced entries"
    - "Automatic fallback: missing user_space uses os2, missing os2 uses user_space"
